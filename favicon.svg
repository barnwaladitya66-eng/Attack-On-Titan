<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="shieldBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#182232" />
      <stop offset="100%" stop-color="#080b10" />
    </radialGradient>

    <!-- Gold Metallic Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe885" />
      <stop offset="45%" stop-color="#d4af37" />
      <stop offset="80%" stop-color="#aa820a" />
      <stop offset="100%" stop-color="#ffd166" />
    </linearGradient>

    <!-- Scout Blue Wing Gradient -->
    <linearGradient id="scoutBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a528a" />
      <stop offset="50%" stop-color="#1d3557" />
      <stop offset="100%" stop-color="#0e1e33" />
    </linearGradient>

    <!-- Scout White Wing Gradient -->
    <linearGradient id="scoutWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#edf2f4" />
      <stop offset="100%" stop-color="#c5d3e8" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#ffd166" flood-opacity="0.6"/>
    </filter>
    
    <filter id="crimsonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Shield Base Background -->
  <path d="M 12 6 L 52 6 C 52 6 54 28 50 42 C 46 53 32 60 32 60 C 32 60 18 53 14 42 C 10 28 12 6 12 6 Z" 
        fill="url(#shieldBg)" 
        stroke="url(#goldBorder)" 
        stroke-width="2.5" 
        stroke-linejoin="round"
        filter="url(#goldGlow)" />

  <!-- Inner Shield Inset Border -->
  <path d="M 15 9 L 49 9 C 49 9 50.8 28 47.2 40.5 C 43.6 50 32 56 32 56 C 32 56 20.4 50 16.8 40.5 C 13.2 28 15 9 15 9 Z" 
        fill="none" 
        stroke="rgba(212, 175, 55, 0.4)" 
        stroke-width="1" />

  <!-- Wings of Freedom (自由の翼): Left Wing (White Feathers) -->
  <g id="white-wing" filter="url(#crimsonShadow)">
    <!-- Feather 1 (Top Left) -->
    <path d="M 29 13 L 20 18 L 22 23 L 30 19 Z" fill="url(#scoutWhite)" />
    <!-- Feather 2 -->
    <path d="M 29 19 L 17 24 L 19 29 L 30 25 Z" fill="url(#scoutWhite)" />
    <!-- Feather 3 -->
    <path d="M 29 25 L 15 31 L 17 36 L 29 31 Z" fill="url(#scoutWhite)" />
    <!-- Feather 4 -->
    <path d="M 28 31 L 16 38 L 19 43 L 28 37 Z" fill="url(#scoutWhite)" />
    <!-- Feather 5 (Bottom) -->
    <path d="M 27 37 L 20 45 L 24 48 L 29 42 Z" fill="url(#scoutWhite)" />
  </g>

  <!-- Wings of Freedom (自由の翼): Right Wing (Scout Blue Feathers - Overlapping) -->
  <g id="blue-wing" filter="url(#crimsonShadow)">
    <!-- Feather 1 (Top Right) -->
    <path d="M 33 16 L 44 21 L 42 26 L 32 22 Z" fill="url(#scoutBlue)" stroke="#457b9d" stroke-width="0.5" />
    <!-- Feather 2 -->
    <path d="M 33 22 L 47 27 L 45 32 L 32 28 Z" fill="url(#scoutBlue)" stroke="#457b9d" stroke-width="0.5" />
    <!-- Feather 3 -->
    <path d="M 33 28 L 49 34 L 47 39 L 33 34 Z" fill="url(#scoutBlue)" stroke="#457b9d" stroke-width="0.5" />
    <!-- Feather 4 -->
    <path d="M 34 34 L 48 41 L 45 46 L 34 40 Z" fill="url(#scoutBlue)" stroke="#457b9d" stroke-width="0.5" />
    <!-- Feather 5 (Bottom) -->
    <path d="M 35 40 L 44 48 L 40 51 L 33 45 Z" fill="url(#scoutBlue)" stroke="#457b9d" stroke-width="0.5" />
  </g>

  <!-- Central Crest Accent / Cross -->
  <circle cx="32" cy="11" r="1.5" fill="#e63946" />
  <circle cx="32" cy="53" r="1.2" fill="#ffd166" />
</svg>
