<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="kanjiBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1c0b10" />
      <stop offset="60%" stop-color="#0e0608" />
      <stop offset="100%" stop-color="#050203" />
    </radialGradient>

    <!-- Gold-Crimson Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="35%" stop-color="#e63946" />
      <stop offset="70%" stop-color="#9d0208" />
      <stop offset="100%" stop-color="#ffd166" />
    </linearGradient>

    <!-- Kanji Gold Foil Gradient -->
    <linearGradient id="kanjiGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3b0" />
      <stop offset="30%" stop-color="#ffd166" />
      <stop offset="70%" stop-color="#e09f3e" />
      <stop offset="100%" stop-color="#fff" />
    </linearGradient>

    <!-- Crimson Glow Filter -->
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#e63946" flood-opacity="0.9" />
    </filter>

    <filter id="textShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.95" />
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#e63946" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield / Badge -->
  <rect x="3" y="3" width="58" height="58" rx="14" 
        fill="url(#kanjiBg)" 
        stroke="url(#borderGrad)" 
        stroke-width="2.5" 
        filter="url(#crimsonGlow)" />

  <!-- Inner Subtle Border -->
  <rect x="6.5" y="6.5" width="51" height="51" rx="10.5" 
        fill="none" 
        stroke="rgba(255, 209, 102, 0.3)" 
        stroke-width="1" />

  <!-- Corner Tactical Notches -->
  <line x1="8" y1="14" x2="14" y2="8" stroke="#ffd166" stroke-width="1.5" />
  <line x1="56" y1="14" x2="50" y2="8" stroke="#ffd166" stroke-width="1.5" />
  <line x1="8" y1="50" x2="14" y2="56" stroke="#ffd166" stroke-width="1.5" />
  <line x1="56" y1="50" x2="50" y2="56" stroke="#ffd166" stroke-width="1.5" />

  <!-- The Iconic Japanese Kanji: 進 (Shin / Advance / Shingeki) -->
  <text x="32" y="47" 
        text-anchor="middle" 
        font-family="'Hiragino Mincho ProN', 'Yu Mincho', 'MS Mincho', 'Noto Serif JP', 'Cinzel Decorative', serif" 
        font-size="38" 
        font-weight="900" 
        fill="url(#kanjiGold)" 
        filter="url(#textShadow)">進</text>
</svg>
